<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no, email=no, address=no, date=no" />
    <meta name="theme-color" content="#F6F4EE" />
    <title>Nossa Bíblia</title>
    <meta name="description" content="Uma experiência devocional profunda, instantânea e minimalista em NAA e NVT. Sem algoritmos, sem distrações, apenas você e as Escrituras." />
    <!-- Prévia ao compartilhar o link (WhatsApp, redes, mensageiros) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nossa Bíblia" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Nossa Bíblia" />
    <meta property="og:description" content="Leitura e busca exata da Bíblia em NAA e NVT. Sem algoritmos, sem anúncios, sem distrações." />
    <meta property="og:url" content="https://nossabiblia.party/" />
    <meta property="og:image" content="https://nossabiblia.party/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nossa Bíblia: Lâmpada para os meus pés é a tua palavra." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Aplica o tema antes da primeira pintura, evitando o flash de tema errado.
      (function () {
        var theme;
        try { theme = localStorage.getItem('nb-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0C0D11' : '#F6F4EE');
      })();
    </script>
    <link rel="preload" href="/fonts/newsreader-normal-300-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/plus-jakarta-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Ícones: o SVG para navegadores modernos, o .ico e o PNG de 32 px como alternativa, o ícone do iOS e o manifest do aplicativo (npm run icons) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Nossa Bíblia" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
