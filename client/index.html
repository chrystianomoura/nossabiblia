<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F4EE" />
    <title>NossaBíblia — A Palavra Viva no seu ritmo</title>
    <meta name="description" content="Uma experiência devocional profunda, instantânea e minimalista em NAA e NVT. Sem algoritmos, sem distrações, apenas você e as Escrituras." />
    <script>
      // Aplica o tema antes da primeira pintura, evitando o flash de tema errado.
      (function () {
        var theme;
        try { theme = localStorage.getItem('nb-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0C0D11' : '#F6F4EE');
      })();
    </script>
    <!-- Google Fonts: Newsreader (Editorial Serif) & Plus Jakarta Sans (Interface) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Archivo:wdth,wght@100..125,700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
