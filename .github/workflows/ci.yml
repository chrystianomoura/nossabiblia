# Integração contínua: a cada push no main e em pull requests, confere o lint, os testes que não dependem do banco e o build do site.
# Os testes contra o banco (search.db.test.js) e a bateria de precisão leem a PRODUÇÃO e rodam só na máquina de quem desenvolve:
# sem DATABASE_URL eles são pulados de propósito (ver o início de server/search.db.test.js).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Dependências (servidor e cliente)
        run: |
          npm ci
          npm --prefix client ci
      - name: Vulnerabilidades conhecidas nas dependências de produção (falha se houver nível alto ou crítico)
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix client audit --omit=dev --audit-level=high
      - name: Lint do cliente
        run: npm --prefix client run lint
      - name: Testes (regras da busca e referências; os de banco são pulados)
        run: npm test
      - name: Build do site (confere a amostra da home e gera os cabeçalhos)
        run: npm --prefix client run build
      - name: Navegador do teste de fumaça (Chromium)
        run: npx --prefix client playwright install --with-deps chromium
      - name: Teste de fumaça da tela (site compilado, API simulada, desktop e celular)
        run: npm --prefix client run test:e2e
      - name: Relatório do teste de fumaça, se falhar
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-e2e
          path: client/test-results
          retention-days: 7
